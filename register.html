<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe2" />
    <meta
      name="description"
      content="Register for Pakistan Hardware Hack 2027 in Lahore."
    />
    <title>Register — Pakistan Hardware Hack 2027</title>
    <link rel="preload" href="/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="register-page">
    <a class="skip-link" href="#registration-form">Skip to the registration form</a>

    <header class="register-header">
      <div class="register-header__inner">
        <a class="register-header__back" href="/#event" aria-label="Back to Pakistan Hardware Hack">← Back</a>
      </div>
    </header>

    <main class="register-main">
      <section class="register-form-shell" id="registration-form" aria-label="Registration" tabindex="-1">
        <p class="register-status" id="register-status" role="status" aria-live="polite">Connecting to the registration form…</p>
        <div
          class="register-form"
          id="register-form-embed"
          data-zite-id="myphsyqt12"
          data-zite-embed-type="standard"
          data-zite-inherit-parameters
          role="region"
          aria-label="TeenHacks registration form"
        ></div>
        <div class="register-fallback" id="register-fallback" hidden>
          <p>The form hasn’t appeared yet. Check your connection and <a href="/register.html">try loading it again</a>, or email <a href="mailto:Hello@teenhacks.org">Hello@teenhacks.org</a> for help.</p>
        </div>
        <noscript>
          <p class="register-fallback">The form needs JavaScript to load. Email <a href="mailto:Hello@teenhacks.org">Hello@teenhacks.org</a> and the TeenHacks team can help.</p>
        </noscript>
      </section>
    </main>

    <script async src="https://server.zite.com/embed/v2-zite/"></script>
    <script type="module" src="/src/register.js"></script>
  </body>
</html>
